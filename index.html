<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spots" />
  <meta name="author" content="Imani Stewart" />
  <meta name="keywords" content="spots html css" />
  <title>Spots</title>
  <link rel="stylesheet" href="./pages/index.css" />
  <title>Document</title>
</head>
<body>
<div class="page">
  <header class="header">
    <img src="./images/logo.svg" alt="spots logo" class="header__logo">
  </header>
  <main class="content">
<section class="profile">
<img src="./images/avatar.jpg" alt="Bessie Coleman" class="profile__photo">
<div class="profile__column">
  <h1 class="profile__header">
    Bessie Coleman
  </h1>
  <p class="profile__description">Civil Aviator </p>
    <button class="profile__edit-button" type="button">
    <img src="./images/pencil-icon.png" alt="pencil icon" class="profile__edit-icon"> Edit Profile
  </button>
</div>
<button class="profile__new-post-button" type="button" class="profile__new-post-icon">
  <img src="./images/plus-icon.png" alt="plus icon" >New Post
</button>
</section>
<section class="cards">
  <ul class="cards__list">
<li class="card">
  <img src="./images/1-photo-by-moritz-feldmann-from-pexels.jpg" alt="Val Thorens" class="card__image">
  <div class="card__content">
    <p class="card__caption">Val Thorens</p>
    <button class="card__like-button" type="button">
      <img src="./images/like-icon.png" alt="heart icon">
    </button>
  </div>
</li><li class="card">
  <img src="./images/2-photo-by-ceiline-from-pexels.jpg" alt="Restaurant Terrace" class="card__image">
  <div class="card__content">
    <p class="card__caption">Restaurant Terrace</p>
    <button class="card__like-button" type="button">
      <img src="./images/like-icon.png" alt="heart icon">
    </button>
  </div>
</li><li class="card">
  <img src="./images/3-photo-by-tubanur-dogan-from-pexels.jpg" alt="An outdoor cafe" class="card__image">
  <div class="card__content">
    <p class="card__caption">An outdoor cafe</p>
    <button class="card__like-button" type="button">
      <img src="./images/like-icon.png" alt="heart icon">
    </button>
  </div>
</li><li class="card">
  <img src="./images/4-photo-by-maurice-laschet-from-pexels.jpg" alt="A very long bridge, over the forest" class="card__image">
  <div class="card__content">
    <p class="card__caption">A very long bridge, over the forest...</p>
    <button class="card__like-button" type="button">
      <img src="./images/like-icon.png" alt="heart icon">
    </button>
  </div>
</li><li class="card">
  <img src="./images/5-photo-by-van-anh-nguyen-from-pexels.jpg" alt="Tunnel with morning light" class="card__image">
  <div class="card__content">
    <p class="card__caption">Tunnel with morning light</p>
    <button class="card__like-button" type="button">
      <img src="./images/like-icon.png" alt="heart icon">
    </button>
  </div>
</li><li class="card">
  <img src="./images/6-photo-by-moritz-feldmann-from-pexels.jpg" alt="Mountain house" class="card__image">
  <div class="card__content">
    <p class="card__caption">Mountain house</p>
    <button class="card__like-button" type="button">
      <img src="./images/like-icon.png" alt="heart icon">
    </button>
  </div>
</li>
  </ul>
</section>
  </main>
  <footer class="footer">
<div class="footer__copyright">2024 &copy Imani Stewart</div>
  </footer>
</div>

</body>
</html>
